apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-cicd-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-cicd

  template:
    metadata:
      labels:
        app: java-cicd

    spec:
      containers:
        - name: java-cicd
          image: madhanalekha26/java-cicd:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080